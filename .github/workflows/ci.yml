name: CI

on:
  push:
    branches: [ main, develop, 'codex/**' ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality Gate (required)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: TypeScript check
        run: npm run typecheck

      - name: Run unit tests
        run: npm run test:unit

      - name: Prisma check
        run: npm run prisma:validate

      - name: Prisma generate
        run: npm run prisma:generate

      - name: Build application
        run: npm run build

      - name: Build OpenNext artifact
        run: npm run build:opennext

  aws-release-scope:
    name: AWS Release Evidence (not applicable to code-only run)
    runs-on: ubuntu-latest
    needs: quality
    if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
    steps:
      - name: Declare release evidence scope
        run: |
          echo "result=not_applicable"
          echo "This code-only run does not validate the already-deployed AWS environment."
          echo "Deploy the candidate SHA, then run the workflow manually for release evidence."

  aws-readonly-e2e:
    name: AWS Read-only E2E (release evidence)
    runs-on: ubuntu-latest
    needs: quality
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 15
    env:
      WMS_AWS_READONLY_E2E: "1"
      WMS_LIVE_BASE_URL: https://d2b1ltxtvypxr4.cloudfront.net
      WMS_WEB_BASE_URL: https://d2b1ltxtvypxr4.cloudfront.net
      WMS_EXPECTED_COMMIT_SHA: ${{ github.event_name == 'workflow_dispatch' && github.sha || '' }}
      WMS_KAN128_PRODUCT_SKU: DEV-ASM-HOSE-DN10-R2AT
      WMS_KAN128_WAREHOUSE_CODE: WH-02
      WMS_KAN128_ORDER_CODE: PI-2026-0010
      WMS_E2E_SYSTEM_ADMIN_EMAIL: ${{ secrets.WMS_E2E_SYSTEM_ADMIN_EMAIL }}
      WMS_E2E_SYSTEM_ADMIN_PASSWORD: ${{ secrets.WMS_E2E_SYSTEM_ADMIN_PASSWORD }}
      WMS_E2E_MANAGER_EMAIL: ${{ secrets.WMS_E2E_MANAGER_EMAIL }}
      WMS_E2E_MANAGER_PASSWORD: ${{ secrets.WMS_E2E_MANAGER_PASSWORD }}
      WMS_E2E_WAREHOUSE_OPERATOR_EMAIL: ${{ secrets.WMS_E2E_WAREHOUSE_OPERATOR_EMAIL }}
      WMS_E2E_WAREHOUSE_OPERATOR_PASSWORD: ${{ secrets.WMS_E2E_WAREHOUSE_OPERATOR_PASSWORD }}
      WMS_E2E_SALES_EXECUTIVE_EMAIL: ${{ secrets.WMS_E2E_SALES_EXECUTIVE_EMAIL }}
      WMS_E2E_SALES_EXECUTIVE_PASSWORD: ${{ secrets.WMS_E2E_SALES_EXECUTIVE_PASSWORD }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify AWS E2E credentials are configured
        shell: bash
        run: |
          test -n "$WMS_E2E_SALES_EXECUTIVE_EMAIL" || (echo "Missing WMS_E2E_SALES_EXECUTIVE_EMAIL" && exit 1)
          test -n "$WMS_E2E_SALES_EXECUTIVE_PASSWORD" || (echo "Missing WMS_E2E_SALES_EXECUTIVE_PASSWORD" && exit 1)
          test -n "$WMS_E2E_WAREHOUSE_OPERATOR_EMAIL" || (echo "Missing WMS_E2E_WAREHOUSE_OPERATOR_EMAIL" && exit 1)
          test -n "$WMS_E2E_WAREHOUSE_OPERATOR_PASSWORD" || (echo "Missing WMS_E2E_WAREHOUSE_OPERATOR_PASSWORD" && exit 1)

      - name: Verify deployed release metadata and database health
        run: npm run smoke:web

      - name: Run AWS read-only operational and role visual evidence
        run: npx playwright test --config=playwright.aws-readonly.config.ts --project=chromium

      - name: Publish AWS browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aws-readonly-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 30

  security:
    name: Security Audit (critical gate)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Block critical production vulnerabilities
        run: npm audit --omit=dev --audit-level=critical

      - name: Report remaining dependency debt
        run: npm audit --audit-level=high
        continue-on-error: true

  staging-mobile-pwa-smoke:
    name: Staging Mobile PWA Smoke (manual)
    runs-on: ubuntu-latest
    needs: quality
    # Manual trigger only — does NOT run on push to avoid confusion with the official WMS web app.
    # Official WMS desktop + mobile access: https://d2b1ltxtvypxr4.cloudfront.net/
    # This job validates the separate STAGING-ONLY Mobile PWA (no production stack exists).
    if: github.event_name == 'workflow_dispatch'
    env:
      MOBILE_PUBLISHED_URL: https://dk5pxve63tjs4.cloudfront.net
      MOBILE_API_BASE_URL: https://7y5wmmppta.execute-api.us-east-1.amazonaws.com

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run staging Mobile PWA smoke tests
        run: npm run smoke:published
